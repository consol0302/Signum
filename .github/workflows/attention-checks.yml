name: Attention regression checks
on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'examples/attention_replay.py'
      - '.github/workflows/attention-checks.yml'
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install runtime
        run: python -m pip install -e .
      - name: Unit tests
        run: |
          set -o pipefail
          python -m unittest discover -s tests -v 2>&1 | tee test-results.txt
      - name: Legacy sampler benchmark
        if: always()
        run: python -m signum.benchmark --output benchmark-output
      - name: Attention development replay
        if: always()
        run: python examples/attention_replay.py --output attention-output.json
      - name: Package tested source and reports
        if: always()
        run: |
          tar --exclude='__pycache__' --exclude='*.pyc' -czf tested-source.tar.gz src tests examples docs pyproject.toml README.md ARCHITECTURE.md AGENTS.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: attention-validation
          retention-days: 7
          path: |
            test-results.txt
            attention-output.json
            benchmark-output/benchmark.json
            tested-source.tar.gz
