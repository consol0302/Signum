[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signum-perception"
version = "0.0.1"
description = "CPU-first deterministic video sampling for multimodal AI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Signum contributors" }]
dependencies = [
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
]

[project.scripts]
signum = "signum.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
